[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectra"
version = "2.0.0"
description = "SPeCTRA: PPO-driven frequency-domain backdoor attack against robust federated aggregation"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.20.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch @ https://download.pytorch.org/whl/cu128/torch-2.7.1%2Bcu128-cp312-cp312-manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "torchvision @ https://download.pytorch.org/whl/cu128/torchvision-0.22.1%2Bcu128-cp312-cp312-manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "torch==2.7.1; sys_platform != 'linux' or platform_machine != 'x86_64' or python_version != '3.12'",
    "torchvision==0.22.1; sys_platform != 'linux' or platform_machine != 'x86_64' or python_version != '3.12'",
    "torchmetrics",
    "numpy>=1.21.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["spectra"]

[tool.flwr.app]
publisher = "spectra"

[tool.flwr.app.components]
serverapp = "spectra.server_app:app"
clientapp = "spectra.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 150
fraction-fit = 0.2
local-epochs = 3

dataset = "svhn"
defense = "fedavg"
attack = "spectra"
theta_optimizer = "ppo"
coordination = "coordinated"
beta = 0.3
seed = 42
experiment = "adhoc"
run_dir = ""

reward_asr_form = "quad"
reward_w_stealth = 0.3
reward_w_detect = 0.3
reward_eval_source = "local"
dirichlet_alpha = 5.0
theta_bounds_misspec = 0.0

enable_heuristics = true
state_include_override_signals = false
enable_oracle_eval = true
pretrained_policy = ""
resume = false
chunk_rounds = 0
fiba_alpha = 0.15

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 100
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.2

[tool.flwr.federations.local-cpu]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.0
